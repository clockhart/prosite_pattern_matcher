<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prosite Pattern Matcher</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <h1><a href="./" id="home">Prosite Pattern <span>Matcher</span></a></h1>
        <p class="tagline">Type a protein motif and find every PROSITE signature that can contain it.</p>

        <form class="search" id="searchForm" autocomplete="off">
            <input
                type="text"
                id="patternInput"
                placeholder="Enter a PROSITE pattern"
                aria-label="Prosite pattern"
                autocapitalize="off"
                spellcheck="false">
            <button type="submit">Search</button>
        </form>

        <p class="examples">Try:
            <button type="button" data-example="R-G-D">R-G-D</button>
            <button type="button" data-example="[ST]-x-[RK]">[ST]-x-[RK]</button>
            <button type="button" data-example="N-{P}-[ST]-{P}">N-{P}-[ST]-{P}</button>
        </p>

        <p class="error" id="error" role="alert" hidden></p>
        <p id="summary" hidden></p>
        <ul id="results"></ul>
        <button type="button" id="showMore" hidden></button>
        <footer id="release"></footer>
    </main>
    <script src="patterns.js"></script>
    <script src="matcher.js"></script>
    <script src="script.js"></script>
</body>
</html>
